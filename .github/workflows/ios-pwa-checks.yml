name: iOS PWA checks
on:
  push:
    branches: [feature/ios-pwa]
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/ios-pwa-checks.yml"
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: PHP syntax
        run: find backend/app backend/routes backend/config backend/database/migrations -name '*.php' -print0 | xargs -0 -n 1 php -l
