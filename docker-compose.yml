services:
  postgres:
    image: postgres:17-alpine
    container_name: family-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: family_hub
      POSTGRES_USER: family_hub
      POSTGRES_PASSWORD: family_hub
    ports:
      - "5432:5432"
    volumes:
      - family_hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_hub -d family_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: family-hub-backend
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "base64:3Ww5xqK7G4mP5HhJ6Zq1K8r2Vv9Nc0Ls7Yp4Qa2Ts6U="
      APP_URL: https://teamportal.ru
      APP_TIMEZONE: Europe/Moscow
      APP_LOCALE: ru
      APP_FALLBACK_LOCALE: ru
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: family_hub
      DB_USERNAME: family_hub
      DB_PASSWORD: family_hub
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -lc "
      php artisan migrate --seed --force &&
      php artisan serve --host=0.0.0.0 --port=8000
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: family-hub-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_DEV_TELEGRAM_USER_ID: 423597651
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  family_hub_pgdata:
