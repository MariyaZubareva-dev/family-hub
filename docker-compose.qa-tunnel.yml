services:
  qa-gateway:
    build:
      context: .
      dockerfile: docker/qa/gateway.Dockerfile
    environment:
      QA_GATEWAY_CONFIG: /run/qa-gateway/config.json
    volumes:
      - ./.env.qa-secrets/gateway.json:/run/qa-gateway/config.json:ro
    ports:
      - '127.0.0.1:18081:8080'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/_qa_health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      - frontend
  qa-tunnel:
    image: cloudflare/cloudflared:latest
    command: [tunnel, --no-autoupdate, --url, 'http://qa-gateway:8080']
    depends_on:
      - qa-gateway
    restart: 'no'
